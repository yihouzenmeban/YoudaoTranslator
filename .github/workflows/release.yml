name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@6.35.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundle
        run: pnpm build

      - name: Package Alfred workflow
        run: ./scripts/package-workflow.sh -v "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          asset="release/YoudaoTranslator-${version}.alfredworkflow"

          gh release create "$tag" "$asset" \
            --title "$tag" \
            --generate-notes
